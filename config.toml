# SETUP
baseurl = "https://www.curedcompliance.com/"
DefaultContentLanguage = "en"
publishdir = "public"
canonifyUrls = "true"
disableKinds = ["RSS","taxonomy","term"] # disable hugo's content that we don't need...
ignoreLogs = ['warning-goldmark-raw-html']

title = "Meat Processing Compliance Software | AI, IoT & Digital Checklists | Cured Compliance" # page title -> see ./layouts/partials/head.html

[author]
    name = "Cured Compliance"
    email = "info@curedcompliance.com"

[params]
    description = "Australian-built compliance software for butchers and meat processors. AI audits, BLE IoT temperature monitoring, digital checklists, and complete traceability. FSANZ-compliant, trusted across Australia." # page description -> see ./layouts/partials/head.html
    phone = "+61427594365"
    businessHours = "Mo-Su 06:00-19:00"
    locality = "Mary Valley"
    region = "Queensland"
    country = "Australia"
    
    [params.author]
        name = "Cured Compliance"
        email = "info@curedcompliance.com"
    images = ["img/logo.png"] #add images here as "img/name.ext" (points to s./static/img/) to populate the default og and twitter <meta> attributes -> see ./layouts/partials/head.html

[[params.social]]
    title = "LinkedIn"
    url = "https://linkedin.com/company/75633596" # add your linkedin profile URL
[[params.social]]
    title = "Facebook"
    url = "https://www.facebook.com/profile.php?id=100085357347917" # add your linkedin profile URL

[sitemap]
  changeFreq = 'always'
  disable = false
  filename = 'sitemap.xml'
  priority = 0.5

[menus]
  [[menus.main]]
    identifier = "Home"
    name = 'Home'
    url = '/'
    weight = 1
  [[menus.main]]
    identifier = "Story"
    name = 'Our Story'
    pageRef = '/About'
    weight = 10
  [[menus.main]]
    identifier = 'Features'
    name = 'Features'
    pageRef = '/features'
    weight = 20
  [[menus.main]]
    identifier = "Resources"
    name = 'Resources'
    pageRef = '/resources'
    weight = 30
  [[menus.main]]
    identifier = "media"
    name = 'Media'
    pageRef = '/media'
    weight = 40

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
    weight = 50