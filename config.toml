# SETUP
baseurl = "https://www.curedcompliance.com/"
DefaultContentLanguage = "en"
publishdir = "public"
canonifyUrls = "true"
disableKinds = ["RSS","taxonomy","term"] # disable hugo's content that we don't need...
ignoreLogs = ['warning-goldmark-raw-html']

title = "Cured Compliance" # brand name, appended to page titles and used as og:site_name -> see ./layouts/partials/head.html
enableGitInfo = true # sitemap <lastmod> from each file's last commit

[author]
    name = "Cured Compliance"
    email = "info@curedcompliance.com"

[params]
    homeTitle = "Compliance Software for Butchers & Meat Processors | Cured Compliance" # home page <title>
    description = "Australian-built compliance software for butchers and meat processors. AI audits, BLE IoT temperature monitoring, digital checklists, and complete traceability. FSANZ-compliant, trusted across Australia." # page description -> see ./layouts/partials/head.html
    videoBaseURL = "https://websitestorageaccount.blob.core.windows.net/videos/" # Azure Blob container holding case study videos + posters -> see ./layouts/partials/video-url.html
    phone = "+61427594365"
    businessHours = "Mo-Su 06:00-19:00"
    locality = "Mary Valley"
    region = "Queensland"
    country = "Australia"
    images = ["img/og-default.jpg"] # default og:image / twitter:image (1200x630) -> see ./layouts/partials/head.html

    [params.author]
        name = "Cured Compliance"
        email = "info@curedcompliance.com"

[[params.social]]
    title = "LinkedIn"
    url = "https://linkedin.com/company/75633596" # add your linkedin profile URL
[[params.social]]
    title = "Facebook"
    url = "https://www.facebook.com/profile.php?id=100085357347917" # add your linkedin profile URL

[sitemap]
  changeFreq = ''
  disable = false
  filename = 'sitemap.xml'
  priority = -1

[mediaTypes."text/plain"]
  suffixes = ["txt"]

[outputFormats.LLMS]
  mediaType = "text/plain"
  baseName = "llms"
  isPlainText = true
  notAlternative = true

[outputFormats.LLMSFULL]
  mediaType = "text/plain"
  baseName = "llms-full"
  isPlainText = true
  notAlternative = true

[outputs]
  home = ["HTML", "LLMS", "LLMSFULL"]

[menus]
  [[menus.main]]
    identifier = "Home"
    name = 'Home'
    url = '/'
    weight = 1
  [[menus.main]]
    identifier = "Story"
    name = 'Our Story'
    pageRef = '/About'
    weight = 10
  [[menus.main]]
    identifier = 'Features'
    name = 'Features'
    pageRef = '/features'
    weight = 20
  [[menus.main]]
    identifier = "Resources"
    name = 'Resources'
    pageRef = '/resources'
    weight = 30
  [[menus.main]]
    identifier = "case-studies"
    name = 'Case Studies'
    pageRef = '/case-studies'
    weight = 35
  [[menus.main]]
    identifier = "media"
    name = 'Media'
    pageRef = '/media'
    weight = 40

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
    weight = 50