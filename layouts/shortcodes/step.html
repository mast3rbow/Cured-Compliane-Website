<div style="position: relative; display: flex; align-items: flex-start; margin-bottom: 2rem; margin-left: 1rem;">
    <div style="flex-shrink: 0; width: 3.5rem; height: 3.5rem; background: linear-gradient(135deg, #3b82f6, #2563eb); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; font-weight: bold; font-size: 1.5rem; box-shadow: 0 4px 12px rgba(59, 130, 246, 0.4); z-index: 10; border: 4px solid white;">
        {{ .Get "number" }}
    </div>
    <div style="margin-left: 1.5rem; flex-grow: 1; background: #f9fafb; border: 1px solid #e5e7eb; border-radius: 0.75rem; padding: 1.5rem; box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);">
        {{ if .Get "title" }}
        <h3 style="font-size: 1.25rem; font-weight: 700; color: #1f2937; margin-bottom: 0.75rem;">
            {{ .Get "title" }}
        </h3>
        {{ end }}
        <div style="color: #4b5563; line-height: 1.7;">
            {{ .Inner | markdownify }}
        </div>
    </div>
</div>
