<div class="relative flex items-start mb-6 ml-4">
    <div class="flex-shrink-0 w-16 h-16 bg-blue-600 rounded-full flex items-center justify-center text-white font-bold text-xl shadow-lg z-10">
        {{ .Get "number" }}
    </div>
    <div class="ml-6 flex-grow">
        {{ if .Get "title" }}
        <h3 class="text-lg font-bold text-gray-800 mb-2">{{ .Get "title" }}</h3>
        {{ end }}
        <div class="text-gray-700">
            {{ .Inner | markdownify }}
        </div>
    </div>
</div>
