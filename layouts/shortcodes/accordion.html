<details style="background: #f9fafb; border: 1px solid #e5e7eb; border-radius: 0.5rem; padding: 1.5rem; margin-bottom: 1rem;">
    <summary style="font-size: 1.25rem; font-weight: 600; color: #1f2937; cursor: pointer; list-style: none;">
        <span style="display: inline-flex; align-items: center;">
            <i class="fa-solid fa-chevron-right" style="margin-right: 0.75rem; font-size: 1rem; transition: transform 0.3s;"></i>
            {{ .Get "title" }}
        </span>
    </summary>
    <div style="margin-top: 1rem; color: #4b5563; line-height: 1.7;">
        {{ .Inner }}
    </div>
</details>

<style>
details[open] summary i.fa-chevron-right {
    transform: rotate(90deg);
}
details summary:hover {
    color: #3b82f6;
}
</style>
