<div class="my-8 text-center">
    <a href="{{ .Get "url" }}" class="inline-flex items-center px-8 py-4 bg-gradient-to-r from-blue-600 to-blue-700 hover:from-blue-700 hover:to-blue-800 text-white font-bold text-lg rounded-lg shadow-lg hover:shadow-xl transition-all duration-300 transform hover:scale-105">
        {{ if .Get "text" }}
            {{ .Get "text" }}
        {{ else }}
            {{ .Inner }}
        {{ end }}
        {{ if .Get "icon" }}
        <i class="{{ .Get "icon" }} ml-2"></i>
        {{ else }}
        <i class="fa-solid fa-arrow-right ml-2"></i>
        {{ end }}
    </a>
</div>
