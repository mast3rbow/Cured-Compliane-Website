<div style="background: linear-gradient(135deg, #2563eb 0%, #1e40af 100%); border-radius: 0.75rem; box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1); padding: 2rem; text-align: center; color: white; font-family: system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica Neue, Arial, Noto Sans, sans-serif;">
    <div style="display: flex; align-items: baseline; justify-content: center; margin-bottom: 0.75rem;">
        <span style="font-size: 3rem; font-weight: bold; line-height: 1;">{{ .Get "number" }}</span>
        {{ if .Get "unit" }}
        <span style="font-size: 1.5rem; margin-left: 0.5rem;">{{ .Get "unit" }}</span>
        {{ end }}
    </div>
    <div style="color: #bfdbfe; font-size: 0.875rem; text-transform: uppercase; letter-spacing: 0.05em; line-height: 1.4;">
        {{ .Inner }}
    </div>
</div>
