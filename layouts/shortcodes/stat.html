<div class="bg-gradient-to-br from-blue-600 to-blue-800 rounded-lg shadow-lg p-6 text-center text-white">
    <div class="flex items-baseline justify-center mb-2">
        <span class="text-5xl font-bold">{{ .Get "number" }}</span>
        {{ if .Get "unit" }}
        <span class="text-2xl ml-1">{{ .Get "unit" }}</span>
        {{ end }}
    </div>
    <div class="text-blue-100 text-sm uppercase tracking-wide">
        {{ .Inner }}
    </div>
</div>
