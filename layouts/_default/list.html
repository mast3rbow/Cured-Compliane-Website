{{ define "main" }}
<div class="container mx-auto px-4 py-8">
    <article class="prose lg:prose-xl mx-auto">
        <h1>{{ .Title }}</h1>
        
        {{ .Content }}
        
        {{ if .Pages }}
        <section class="mt-8">
            <h2 class="text-2xl font-bold mb-4">{{ .Title }} List</h2>
            <ul class="space-y-4">
                {{ range .Pages }}
                <li>
                    <a href="{{ .RelPermalink }}" class="text-blue-600 hover:text-blue-800 underline">
                        {{ .Title }}
                    </a>
                    {{ if .Description }}
                    <p class="text-gray-600 mt-1">{{ .Description }}</p>
                    {{ end }}
                </li>
                {{ end }}
            </ul>
        </section>
        {{ end }}
    </article>
</div>
{{ end }}
