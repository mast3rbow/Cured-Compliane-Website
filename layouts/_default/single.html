{{ define "main" }}

    <link rel="stylesheet"  href="/css/normalize.min.css">

    <style>
      h2, h3, h4 {
        font-size: 1.25rem;
        font-weight: bold;
      }
      /* Readable spacing for long-form pages (privacy, terms); enable with `prose: true` in front matter */
      .prose-body p, .prose-body ul { margin-bottom: 1rem; }
      .prose-body ul { list-style: disc; padding-left: 1.5rem; }
      .prose-body li { margin-bottom: 0.25rem; }
      .prose-body h3, .prose-body h4 { margin: 2rem 0 0.75rem; }
      .prose-body a { text-decoration: underline; }
    </style>

    {{ partial "navbar.html" . }}

    <div id="{{ .Title }}" class="w-full flex flex-col justify-center items-center">
        <div class="self-center w-full sm:w-2/3 xl:w-1/2 px-4 sm:px:0 pt-16">
            <h1 class="font-bold uppercase tracking-widest text-gray-800 text-2xl mb-4">{{ .Title }}</h1>
            <div class="font-light text-black text-lg{{ if .Params.prose }} prose-body{{ end }}">
                {{ .Content }}
            </div>
        </div>
    </div>

{{ end }}
