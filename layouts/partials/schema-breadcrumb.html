{{ if .Parent }}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "BreadcrumbList",
  "itemListElement": [
    {
      "@type": "ListItem",
      "position": 1,
      "name": "Home",
      "item": "{{ site.BaseURL }}"
    }{{ if and .Parent (ne .Parent.Kind "home") }},
    {
      "@type": "ListItem",
      "position": 2,
      "name": {{ .Parent.Title | jsonify }},
      "item": {{ .Parent.RelPermalink | jsonify }}
    }{{ end }},
    {
      "@type": "ListItem",
      "position": {{ if and .Parent (ne .Parent.Kind "home") }}3{{ else }}2{{ end }},
      "name": {{ .Title | jsonify }},
      "item": {{ .RelPermalink | jsonify }}
    }
  ]
}
</script>
{{ end }}
