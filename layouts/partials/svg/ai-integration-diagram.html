<div style="display: flex; justify-content: center; margin: 3rem 0;">
<svg width="700" height="700" viewBox="0 0 700 700" xmlns="http://www.w3.org/2000/svg">
  <!-- Central AI Brain -->
  <circle cx="350" cy="350" r="80" fill="url(#brainGradient)" stroke="#1e40af" stroke-width="3"/>
  <text x="350" y="340" text-anchor="middle" font-size="16" font-weight="bold" fill="white">AI</text>
  <text x="350" y="360" text-anchor="middle" font-size="14" fill="white">Compliance</text>
  <text x="350" y="378" text-anchor="middle" font-size="14" fill="white">Engine</text>
  
  <!-- Data Sources Circle Positions (8 points) -->
  <!-- 1. Temperature IoT (top) -->
  <g transform="translate(350, 100)">
    <circle r="60" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
    <text y="-10" text-anchor="middle" font-size="32">🌡️</text>
    <text y="15" text-anchor="middle" font-size="12" font-weight="600">Temperature</text>
    <text y="30" text-anchor="middle" font-size="12" font-weight="600">IoT</text>
    <line x1="0" y1="60" x2="0" y2="170" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrowblue)"/>
  </g>
  
  <!-- 2. Digital Checklists (top-right) -->
  <g transform="translate(526, 173)">
    <circle r="60" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
    <text y="-10" text-anchor="middle" font-size="32">✓</text>
    <text y="15" text-anchor="middle" font-size="12" font-weight="600">Digital</text>
    <text y="30" text-anchor="middle" font-size="12" font-weight="600">Checklists</text>
    <line x1="-44" y1="44" x2="-110" y2="110" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrowblue)"/>
  </g>
  
  <!-- 3. Production Logs (right) -->
  <g transform="translate(600, 350)">
    <circle r="60" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
    <text y="-10" text-anchor="middle" font-size="32">📋</text>
    <text y="15" text-anchor="middle" font-size="12" font-weight="600">Production</text>
    <text y="30" text-anchor="middle" font-size="12" font-weight="600">Logs</text>
    <line x1="-60" y1="0" x2="-170" y2="0" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrowblue)"/>
  </g>
  
  <!-- 4. Training Records (bottom-right) -->
  <g transform="translate(526, 526)">
    <circle r="60" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
    <text y="-10" text-anchor="middle" font-size="32">🎓</text>
    <text y="15" text-anchor="middle" font-size="12" font-weight="600">Training</text>
    <text y="30" text-anchor="middle" font-size="12" font-weight="600">Records</text>
    <line x1="-44" y1="-44" x2="-110" y2="-110" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrowblue)"/>
  </g>
  
  <!-- 5. Supplier Certs (bottom) -->
  <g transform="translate(350, 600)">
    <circle r="60" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
    <text y="-10" text-anchor="middle" font-size="32">📜</text>
    <text y="15" text-anchor="middle" font-size="12" font-weight="600">Supplier</text>
    <text y="30" text-anchor="middle" font-size="12" font-weight="600">Certs</text>
    <line x1="0" y1="-60" x2="0" y2="-170" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrowblue)"/>
  </g>
  
  <!-- 6. Incident Reports (bottom-left) -->
  <g transform="translate(173, 526)">
    <circle r="60" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
    <text y="-10" text-anchor="middle" font-size="32">⚠️</text>
    <text y="15" text-anchor="middle" font-size="12" font-weight="600">Incident</text>
    <text y="30" text-anchor="middle" font-size="12" font-weight="600">Reports</text>
    <line x1="44" y1="-44" x2="110" y2="-110" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrowblue)"/>
  </g>
  
  <!-- 7. Equipment Maintenance (left) -->
  <g transform="translate(100, 350)">
    <circle r="60" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
    <text y="-10" text-anchor="middle" font-size="32">🔧</text>
    <text y="15" text-anchor="middle" font-size="12" font-weight="600">Equipment</text>
    <text y="30" text-anchor="middle" font-size="12" font-weight="600">Maintenance</text>
    <line x1="60" y1="0" x2="170" y2="0" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrowblue)"/>
  </g>
  
  <!-- 8. Customer Complaints (top-left) -->
  <g transform="translate(173, 173)">
    <circle r="60" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
    <text y="-10" text-anchor="middle" font-size="32">💬</text>
    <text y="15" text-anchor="middle" font-size="12" font-weight="600">Customer</text>
    <text y="30" text-anchor="middle" font-size="12" font-weight="600">Complaints</text>
    <line x1="44" y1="44" x2="110" y2="110" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrowblue)"/>
  </g>
  
  <!-- Gradient for central brain -->
  <defs>
    <linearGradient id="brainGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e40af;stop-opacity:1" />
    </linearGradient>
    <marker id="arrowblue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#3b82f6" />
    </marker>
  </defs>
</svg>
</div>
