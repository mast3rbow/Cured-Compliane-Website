<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "FAQPage",
  "mainEntity": [
    {{- with .Params.faq }}
      {{- range $index, $item := . }}
        {{- if $index }},{{ end }}
        {
          "@type": "Question",
          "name": {{ $item.question | jsonify }},
          "acceptedAnswer": {
            "@type": "Answer",
            "text": {{ $item.answer | jsonify }}
          }
        }
      {{- end }}
    {{- else }}
      {
        "@type": "Question",
        "name": "What is Cured Compliance?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Cured Compliance is Australian food safety compliance software for butchers, smallgoods makers and meat processors. It combines BLE IoT temperature monitoring, digital checklists, batch traceability and AI-assisted compliance audits in one platform, built around FSANZ standards and each state's regulator."
        }
      }
    {{- end }}
  ]
}
</script>
