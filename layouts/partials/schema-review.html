{{ $testimonials := hugo.Data.testimonials }}
{{ if $testimonials }}
{{ if $testimonials.testimonials }}
{{ range $testimonials.testimonials }}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Review",
  "itemReviewed": {
    "@type": "SoftwareApplication",
    "name": "Cured Compliance",
    "applicationCategory": "BusinessApplication",
    "operatingSystem": "Web Browser"
  },
  "author": {
    "@type": {{ if .organization }}"Organization",
    "name": "{{ .organization }}"{{ else }}"Person",
    "name": "{{ .name }}"{{ end }}
  },
  {{ if .rating }}
  "reviewRating": {
    "@type": "Rating",
    "ratingValue": "{{ .rating }}",
    "bestRating": "5"
  },
  {{ end }}
  "reviewBody": "{{ .quote }}"
}
</script>
{{ end }}
{{ end }}
{{ end }}
